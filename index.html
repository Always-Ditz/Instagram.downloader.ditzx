<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #121212;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Grid Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        .instagram-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            filter: brightness(0) invert(1);
            animation: fadeInScale 0.8s ease-out 0.4s both;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ffffff, #cccccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #aaaaaa;
            font-size: 1rem;
        }

        .download-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s ease-out 0.5s both;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            color: #ffffff;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
        }

        input[type="text"]::placeholder {
            color: #666666;
        }

        .button {
            width: 100%;
            padding: 15px;
            background: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 12px;
            color: #121212;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .button:hover {
            background: transparent;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            display: none;
        }

        .status-message.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.4);
            color: #4CAF50;
        }

        .status-message.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.4);
            color: #f44336;
        }

        .status-message.loading {
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid rgba(33, 150, 243, 0.4);
            color: #2196F3;
        }

        .preview-section {
            margin-top: 30px;
            display: none;
            animation: fadeInUp 0.6s ease-out both;
        }

        .preview-content {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .preview-content img,
        .preview-content video {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .download-btn {
            display: inline-block;
            padding: 12px 30px;
            background: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 8px;
            color: #121212;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: transparent;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .download-section {
                padding: 20px;
            }
            
            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <svg class="instagram-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
            <h1>Instagram Downloader</h1>
            <p class="subtitle">Download Instagram Photos, Videos, Reels & Stories</p>
        </div>

        <div class="download-section">
            <div class="input-group">
                <label for="instagram-url">Paste Instagram URL</label>
                <input 
                    type="text" 
                    id="instagram-url" 
                    placeholder="https://www.instagram.com/p/..."
                    autocomplete="off"
                >
            </div>
            <button class="button" onclick="downloadMedia()">
                Download
            </button>
            
            <div class="status-message" id="status-message"></div>
        </div>

        <div class="preview-section" id="preview-section">
            <div class="preview-content" id="preview-content"></div>
        </div>

    </div>

    <script>
        async function downloadMedia() {
            const urlInput = document.getElementById('instagram-url');
            const statusMessage = document.getElementById('status-message');
            const previewSection = document.getElementById('preview-section');
            const previewContent = document.getElementById('preview-content');
            const url = urlInput.value.trim();

            // Reset previous state
            statusMessage.style.display = 'none';
            previewSection.style.display = 'none';
            statusMessage.className = 'status-message';

            // Validate URL
            if (!url) {
                showMessage('error', 'Please enter an Instagram URL');
                return;
            }

            if (!isValidInstagramUrl(url)) {
                showMessage('error', 'Please enter a valid Instagram URL');
                return;
            }

            // Show loading
            showMessage('loading', 'Fetching Instagram content...');

            try {
                // Call API to get Instagram data
                const response = await fetch('/api/ig', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to fetch Instagram content');
                }

                // Show success message
                showMessage('success', 'Content fetched successfully!');

                // Display preview
                displayPreview(data);

            } catch (error) {
                showMessage('error', error.message || 'An error occurred. Please try again.');
                console.error('Error:', error);
            }
        }

        function isValidInstagramUrl(url) {
            const patterns = [
                /^https?:\/\/(www\.)?instagram\.com\/(p|reel|tv)\/[\w-]+/,
                /^https?:\/\/(www\.)?instagram\.com\/stories\/[\w.-]+\/\d+/
            ];
            return patterns.some(pattern => pattern.test(url));
        }

        function showMessage(type, message) {
            const statusMessage = document.getElementById('status-message');
            statusMessage.className = `status-message ${type}`;
            
            if (type === 'loading') {
                statusMessage.innerHTML = `<div class="loader"></div><p style="margin-top: 10px;">${message}</p>`;
            } else {
                statusMessage.textContent = message;
            }
            
            statusMessage.style.display = 'block';
        }

        function displayPreview(data) {
            const previewSection = document.getElementById('preview-section');
            const previewContent = document.getElementById('preview-content');
            
            let html = '';

            // Display metadata if available
            if (data.metadata) {
                const meta = data.metadata;
                html += `
                    <div style="text-align: left; margin-bottom: 20px; padding: 20px; background: rgba(255, 255, 255, 0.05); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);">
                        ${meta.username ? `
                            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                                <svg style="width: 24px; height: 24px; fill: #ffffff;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                                </svg>
                                <span style="font-size: 1.1rem; font-weight: 600; color: #ffffff;">@${meta.username}</span>
                            </div>
                        ` : ''}
                        
                        ${meta.title ? `
                            <p style="margin: 15px 0; color: #cccccc; line-height: 1.6; font-size: 0.95rem;">
                                ${meta.title.length > 300 ? meta.title.substring(0, 300) + '...' : meta.title}
                            </p>
                        ` : ''}
                        
                        <div style="display: flex; gap: 25px; margin-top: 15px; flex-wrap: wrap;">
                            ${meta.like_count ? `
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <svg style="width: 20px; height: 20px; fill: #ff3366;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                                    </svg>
                                    <span style="color: #ffffff; font-weight: 500;">${meta.like_count.toLocaleString()}</span>
                                    <span style="color: #aaaaaa; font-size: 0.9rem;">likes</span>
                                </div>
                            ` : ''}
                            
                            ${meta.comment_count ? `
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <svg style="width: 20px; height: 20px; fill: #aaaaaa;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                                    </svg>
                                    <span style="color: #ffffff; font-weight: 500;">${meta.comment_count.toLocaleString()}</span>
                                    <span style="color: #aaaaaa; font-size: 0.9rem;">comments</span>
                                </div>
                            ` : ''}
                            
                            ${meta.taken_at ? `
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <svg style="width: 20px; height: 20px; fill: #aaaaaa;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
                                    </svg>
                                    <span style="color: #aaaaaa; font-size: 0.9rem;">
                                        ${new Date(meta.taken_at * 1000).toLocaleDateString('en-US', { 
                                            year: 'numeric', 
                                            month: 'short', 
                                            day: 'numeric' 
                                        })}
                                    </span>
                                </div>
                            ` : ''}
                        </div>
                        
                        ${meta.comments && meta.comments.length > 0 ? `
                            <details style="margin-top: 20px;">
                                <summary style="cursor: pointer; color: #aaaaaa; font-size: 0.9rem; padding: 10px 0; border-top: 1px solid rgba(255, 255, 255, 0.1);">
                                    View top ${Math.min(meta.comments.length, 5)} comments
                                </summary>
                                <div style="margin-top: 15px; max-height: 300px; overflow-y: auto;">
                                    ${meta.comments.slice(0, 5).map(comment => `
                                        <div style="padding: 12px; background: rgba(255, 255, 255, 0.03); border-radius: 8px; margin-bottom: 10px;">
                                            <div style="font-weight: 600; color: #ffffff; margin-bottom: 5px; font-size: 0.9rem;">@${comment.username}</div>
                                            <div style="color: #cccccc; font-size: 0.85rem; line-height: 1.4;">${comment.text}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </details>
                        ` : ''}
                    </div>
                `;
            }

            if (data.type === 'image') {
                html += `
                    <img src="${data.url}" alt="Instagram Image">
                    <br>
                    <a href="/api/download?url=${encodeURIComponent(data.url)}&type=image" class="download-btn" download>
                        Download Image
                    </a>
                `;
            } else if (data.type === 'video') {
                html += `
                    <video controls ${data.thumbnail ? `poster="${data.thumbnail}"` : ''}>
                        <source src="${data.url}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    <br>
                    <a href="/api/download?url=${encodeURIComponent(data.url)}&type=video" class="download-btn" download>
                        Download Video
                    </a>
                `;
            } else if (data.type === 'carousel') {
                html += '<h3 style="margin-bottom: 15px;">Multiple Items</h3>';
                data.items.forEach((item, index) => {
                    if (item.type === 'image') {
                        html += `
                            <img src="${item.url}" alt="Instagram Image ${index + 1}" style="margin: 10px 0;">
                            <br>
                            <a href="/api/download?url=${encodeURIComponent(item.url)}&type=image" class="download-btn" download>
                                Download Image ${index + 1}
                            </a>
                            <br><br>
                        `;
                    } else if (item.type === 'video') {
                        html += `
                            <video controls style="margin: 10px 0;" ${data.thumbnail ? `poster="${data.thumbnail}"` : ''}>
                                <source src="${item.url}" type="video/mp4">
                            </video>
                            <br>
                            <a href="/api/download?url=${encodeURIComponent(item.url)}&type=video" class="download-btn" download>
                                Download Video ${index + 1}
                            </a>
                            <br><br>
                        `;
                    }
                });
            }

            previewContent.innerHTML = html;
            previewSection.style.display = 'block';
        }

        // Allow Enter key to trigger download
        document.getElementById('instagram-url').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                downloadMedia();
            }
        });
    </script>
</body>
</html>
